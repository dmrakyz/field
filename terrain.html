<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="花间 world"><meta name="theme-color" content="#000000"><link rel="apple-touch-icon" href="icon-180.png">

<style>
html,body{margin:0;position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#b8cde6;font:13px/1.35 -apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas{display:block;position:fixed;left:0;top:0;z-index:-1;touch-action:none}
#hud{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 8px);color:#fff;text-shadow:0 1px 4px #0008;white-space:pre;pointer-events:none}
#bar{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:62vw}
#bar button{border:0;border-radius:18px;padding:9px 13px;background:#fffc;color:#5d4250;font:600 13px system-ui;box-shadow:0 2px 10px #0003}
#bar button.on{background:#e88ca5;color:#fff}
#tip{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);color:#fff;text-shadow:0 1px 4px #0008;pointer-events:none;max-width:36vw}
</style></head><body>
<div id="hud">loading…</div>
<div id="tip">left side: drag to move · right side: drag to look · desktop: WASD, Q/E, shift</div>
<style>
#menu{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);display:grid;grid-template-columns:repeat(3,auto);gap:6px;max-height:62vh;overflow:auto;padding:10px;border-radius:18px;background:#fff5;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 18px #0003}
#menu[hidden],#clock[hidden],#lobby[hidden]{display:none}
#lobN{font:700 11px system-ui;margin-left:3px}
#lobby{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100vw - 32px));max-height:min(78vh,640px);overflow:auto;padding:14px 16px 16px;border-radius:20px;background:#fff8f4ee;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 40px #0005;color:#5d4250;font:14px system-ui;z-index:30;box-sizing:border-box}
#lobby .lh{display:flex;align-items:center;gap:8px;font-size:18px;margin-bottom:10px}#lobby .lh span{flex:1;font-size:12px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lobby label{display:block;font-size:12px;opacity:.85;margin:8px 0 2px}
#lobby .lr{display:flex;gap:6px;margin:4px 0;flex-wrap:wrap}#lobby .lr input{flex:1;min-width:0;border:1px solid #5d425033;border-radius:12px;padding:9px 11px;font:15px system-ui;background:#fff;color:#5d4250}
#lobby button{border:0;border-radius:14px;padding:9px 13px;background:#fff;color:#5d4250;font:600 13px system-ui;box-shadow:0 2px 8px #0002;cursor:pointer}
#lobby button.big{flex:1;background:#e88ca5;color:#fff;padding:12px}#lobX{background:transparent!important;box-shadow:none!important}
#lobby .ls{margin:14px 0 4px;font:700 12px system-ui;letter-spacing:.05em;text-transform:uppercase;opacity:.7;display:flex;align-items:center;gap:6px}#lobby .ls button{padding:2px 8px}
#lobby .row{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid #5d425014}#lobby .row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#lobby .row small{opacity:.6}
#lobby .dot{width:10px;height:10px;border-radius:50%;flex:none}#lobby .empty{opacity:.6;font-size:13px;padding:6px 2px}
#net{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);color:#fff;font:600 12px system-ui;text-shadow:0 1px 4px #0009;pointer-events:none}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);padding:8px 16px;border-radius:16px;background:#0008;color:#fff;font:600 15px system-ui;pointer-events:none;white-space:pre-wrap;text-align:center;max-width:88vw}
#toast[hidden],#chatIn[hidden]{display:none}
#chatLog{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);max-width:60vw;color:#fff;font:13px system-ui;text-shadow:0 1px 3px #000c;pointer-events:none;display:flex;flex-direction:column;gap:2px}
#chatIn{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 60px);padding:10px 14px;border:0;border-radius:18px;font:15px system-ui;background:#fffe;z-index:6}
#bUse{background:#ffe3a8 !important;font-size:16px !important}
#menu button{border:0;border-radius:18px;padding:9px 13px;background:#fffc;color:#5d4250;font:600 13px system-ui;box-shadow:0 2px 10px #0003}
#menu button.on{background:#e88ca5;color:#fff}
#clock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(#0a1030aa,#000a);touch-action:none;z-index:5}
#clock .face{position:relative;width:min(78vw,340px);height:min(78vw,340px)}
#clock svg{width:100%;height:100%;overflow:visible}
#clock .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f6efd8;font:600 30px Georgia,serif;text-shadow:0 0 12px #ffd98a88;pointer-events:none}
#clock .t small{font:500 12px system-ui;letter-spacing:.2em;opacity:.8;margin-top:4px}
#clock .row{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;gap:10px}
#clock .row button{border:1px solid #f6efd866;border-radius:18px;padding:9px 16px;background:#ffffff1a;color:#f6efd8;font:600 13px system-ui}
</style>

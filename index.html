<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>花间 · A Garden for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts load in the background; if they are blocked (e.g. in mainland China) the page just uses system serif fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --ink:#3b2b33; --ink2:#7a6470; --paper:rgba(255,249,246,.82); --paper2:rgba(255,246,243,.94);
  --rose:#d98a9d; --rose2:#f3c4cf; --gold:#c9a27a; --line:rgba(120,80,95,.16);
  --serif:'Cormorant Garamond','Noto Serif SC',Georgia,serif; --zh:'Noto Serif SC','Songti SC','STSong',serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#140f1a;overscroll-behavior:none}
body{font-family:var(--serif);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;outline:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.zh{font-family:var(--zh)}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;
  background:radial-gradient(120% 90% at 50% 110%,#f6b9a8 0%,#c98aa5 28%,#5d4472 62%,#1b1424 100%);transition:opacity 1.4s ease, visibility 1.4s}
#loader.gone{opacity:0;visibility:hidden;pointer-events:none}
#loader .t1{font-family:var(--zh);font-size:44px;letter-spacing:.35em;color:#fff6f2;text-indent:.35em;font-weight:400;text-shadow:0 2px 24px rgba(255,190,200,.5)}
#loader .t2{font-style:italic;font-size:22px;color:#ffe9e4;opacity:.9;letter-spacing:.06em}
#loader .bar{width:180px;height:2px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden;margin-top:26px}
#loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd9cf,#fff);transition:width .3s}
#loader .st{font-size:14px;color:rgba(255,240,236,.7);letter-spacing:.08em;min-height:1em}
#startBtn{margin-top:22px;padding:14px 34px;border-radius:40px;border:1px solid rgba(255,255,255,.55);color:#fff;font-size:18px;letter-spacing:.12em;
  background:rgba(255,255,255,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transform:translateY(8px);transition:all .8s}
#startBtn.on,.who.on{opacity:1;transform:none}
.whoRow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.who{margin-top:14px;padding:12px 24px;border-radius:40px;border:1px solid rgba(255,255,255,.55);color:#fff;font-size:17px;letter-spacing:.06em;background:rgba(255,255,255,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transform:translateY(8px);transition:all .8s}
.who .zh{display:block;font-size:14px;letter-spacing:.2em;opacity:.85;margin-top:2px}
#netPill{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(var(--sab) + 14px);z-index:11;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1;color:#fff;background:rgba(40,25,45,.35);opacity:.55;pointer-events:none;transition:all .6s}
#netPill.on{background:rgba(217,120,145,.85);opacity:1;animation:beat 2.4s ease-in-out infinite}
#netPill.off{opacity:.25}
@keyframes beat{0%,60%,100%{transform:scale(1)}30%{transform:scale(1.18)}}
#actRow{position:fixed;left:50%;bottom:calc(var(--sab) + 26px);transform:translateX(-50%);z-index:12;display:flex;gap:10px}
#actRow .btn{white-space:nowrap;font-size:15px;padding:0 16px;background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 16px rgba(40,20,40,.2)}
.ntag{position:fixed;left:0;top:0;z-index:6;color:#fff;font-size:15px;letter-spacing:.06em;text-shadow:0 1px 8px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap}
#startBtn .zh{display:block;font-size:15px;letter-spacing:.3em;opacity:.85;margin-top:2px}
.petalfall{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.petalfall i{position:absolute;top:-20px;width:10px;height:13px;border-radius:70% 0 70% 0;background:#ffd6de;opacity:.7;animation:fall linear infinite}
@keyframes fall{to{transform:translate(-60px,110vh) rotate(540deg)}}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 12px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;z-index:10;pointer-events:none;transition:opacity .6s}
#hud>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:8px;height:40px;padding:0 15px 0 11px;border-radius:22px;background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 18px rgba(40,20,40,.18);font-size:17px;font-weight:500;letter-spacing:.04em}
.pill svg{width:20px;height:20px}
.rgt{display:flex;gap:9px}
.round{position:relative;width:42px;height:42px;border-radius:50%;background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;box-shadow:0 4px 18px rgba(40,20,40,.18)}
.round svg{width:21px;height:21px}
.badge{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--rose);color:#fff;font:600 11px/20px system-ui,sans-serif;text-align:center}
.round.pulse{animation:pulse 1.2s ease 2}
@keyframes pulse{50%{transform:scale(1.18)}}
#hud.dim{opacity:.0;pointer-events:none}
#hud.dim>*{pointer-events:none}

/* joystick */
#joy{position:fixed;left:0;bottom:0;width:150px;height:150px;margin:0 0 calc(var(--sab) + 18px) 18px;border-radius:50%;z-index:9;pointer-events:none;
  border:1.5px solid rgba(255,255,255,.35);background:radial-gradient(circle,rgba(255,255,255,.10),rgba(255,255,255,.03));transition:opacity .4s}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,250,248,.55);box-shadow:0 2px 12px rgba(0,0,0,.15)}
#joy.idle{opacity:.45}
#joy.off{opacity:0}

/* toast & hint */
#toast{position:fixed;left:50%;top:calc(var(--sat) + 100px);transform:translate(-50%,-10px);padding:10px 20px;border-radius:24px;background:var(--paper2);box-shadow:0 6px 24px rgba(40,20,40,.22);
  font-size:17px;opacity:0;transition:all .5s;z-index:20;text-align:center;max-width:88vw;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast b{font-weight:600;color:#a8566c}
#hint{position:fixed;left:50%;bottom:calc(var(--sab) + 190px);transform:translateX(-50%);color:#fff;font-size:17px;text-align:center;letter-spacing:.04em;line-height:1.55;
  text-shadow:0 1px 10px rgba(0,0,0,.5);opacity:0;transition:opacity 1s;pointer-events:none;z-index:8;width:90vw}
#hint.on{opacity:.95}
#hint .zh{font-size:14px;opacity:.9;letter-spacing:.12em}
#marker{position:fixed;width:34px;height:34px;margin:-17px;border-radius:50%;border:2px solid rgba(255,255,255,.9);pointer-events:none;opacity:0;z-index:7}
#marker.go{animation:ring .7s ease-out}
@keyframes ring{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.5)}}

/* flower card */
.sheet{position:fixed;left:50%;bottom:calc(var(--sab) + 14px);transform:translateX(-50%);width:min(92vw,420px);padding:18px 20px 16px;border-radius:24px;background:var(--paper2);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(40,20,40,.3);z-index:15;animation:up .6s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
#card .nm{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#card .zh1{font-family:var(--zh);font-size:26px;font-weight:600;letter-spacing:.08em}
#card .en1{font-size:23px;font-style:italic;color:var(--ink2)}
#card .meta{margin-top:3px;font-size:15px;color:var(--ink2);display:flex;align-items:center;gap:7px}
#card .sw{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
#card .mean{margin-top:9px;font-size:16.5px;line-height:1.45}
#card .mean .zh{font-size:14.5px;color:var(--ink2)}
.row{display:flex;gap:10px;margin-top:14px}
.btn{height:46px;border-radius:23px;padding:0 18px;font-size:16.5px;font-weight:500;background:rgba(120,80,95,.08);display:flex;align-items:center;justify-content:center;gap:7px}
.btn.primary{flex:1;background:linear-gradient(135deg,#e7a1b2,#d18299);color:#fff;box-shadow:0 4px 16px rgba(209,130,153,.4)}
.btn.primary.done{background:linear-gradient(135deg,#bfa3ad,#a88d98);box-shadow:none}
.btn .zh{font-size:14px;letter-spacing:.06em}

/* panels */
.panel{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;padding:calc(var(--sat) + 18px) 18px calc(var(--sab) + 18px);
  background:linear-gradient(180deg,rgba(255,247,244,.93),rgba(252,236,236,.95));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:fade .45s ease;overflow:auto}
@keyframes fade{from{opacity:0}}
.panel h2{font-weight:500;font-size:30px;letter-spacing:.02em;display:flex;align-items:baseline;gap:12px}
.panel h2 .zh{font-size:20px;letter-spacing:.2em;color:var(--ink2);font-weight:400}
.panel .sub{color:var(--ink2);font-size:16px;margin:4px 0 14px;font-style:italic}
.close{position:absolute;right:16px;top:calc(var(--sat) + 14px);width:42px;height:42px;border-radius:50%;background:rgba(120,80,95,.09);font-size:22px;line-height:42px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cardf{position:relative;border-radius:18px;background:rgba(255,255,255,.7);overflow:hidden;box-shadow:0 3px 14px rgba(80,40,60,.08);padding-bottom:10px}
.cardf img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.cardf .n1{font-family:var(--zh);font-size:17px;font-weight:600;padding:6px 12px 0;letter-spacing:.06em}
.cardf .n2{font-size:16px;font-style:italic;color:var(--ink2);padding:0 12px}
.cardf.locked img{filter:brightness(0) opacity(.18)}
.cardf.locked .n1,.cardf.locked .n2{color:#b9a8b0}
.cardf .heart{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;color:#d4728c;font-size:15px}
.cardf .mean2{padding:2px 12px 0;font-size:13.5px;color:var(--ink2);line-height:1.35}

#bqView{flex:1;min-height:200px}
#bq{background:linear-gradient(180deg,rgba(255,247,244,.0),rgba(255,247,244,.0) 45%,rgba(255,244,240,.92) 62%);backdrop-filter:none;-webkit-backdrop-filter:none}
#bq h2,#bq .sub{text-shadow:0 1px 12px rgba(255,255,255,.8)}
#bqList{display:flex;flex-direction:column;gap:6px;margin:6px 0 12px}
.bqi{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.72);font-size:16.5px}
.bqi .zh{font-weight:600}
.bqi .c{color:var(--ink2);font-style:italic;margin-left:auto;font-size:15px}
.bqi .x{width:30px;height:30px;border-radius:50%;background:rgba(120,80,95,.08);font-size:15px}
.bqempty{padding:16px;text-align:center;color:var(--ink2);font-style:italic;font-size:17px;line-height:1.6}
#shareOut{margin-top:10px;font-size:14px;color:var(--ink2);text-align:center;min-height:1em}

#caption{position:fixed;left:0;right:0;top:22%;text-align:center;color:#fff;z-index:12;pointer-events:none;opacity:0;transition:opacity 2.5s;text-shadow:0 2px 18px rgba(255,170,200,.7)}
#caption.on{opacity:1}
#caption .a{font-family:var(--zh);font-size:25px;letter-spacing:.25em}
#caption .b{font-style:italic;font-size:21px;margin-top:8px;letter-spacing:.04em}
#swingUI{position:fixed;left:50%;bottom:calc(var(--sab) + 26px);transform:translateX(-50%);z-index:12}
#swingUI .btn{background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

#peek table{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px;background:rgba(255,255,255,.6);border-radius:12px;overflow:hidden}
#peek td,#peek th{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
#peek td:first-child,#peek th:first-child{text-align:left}
#peek tr.ran{background:rgba(243,196,207,.45);font-weight:600}
#peek .verdict{margin-top:14px;padding:14px;border-radius:14px;background:rgba(255,255,255,.75);font-size:17px;line-height:1.5}
#peek input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);padding:0 12px;font:16px system-ui;margin-top:6px;background:#fff}
.fly{position:fixed;z-index:40;font-size:22px;pointer-events:none;transition:all .9s cubic-bezier(.5,0,.3,1)}
.sec{margin:16px 0 4px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.sec .zh{letter-spacing:.2em;margin-left:6px;text-transform:none}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 14px;background:rgba(255,255,255,.66);border-bottom:1px solid var(--line)}
.srow:first-of-type{border-radius:14px 14px 0 0}.srow:last-child{border-radius:0 0 14px 14px;border-bottom:0}
.sgrp{border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(80,40,60,.06)}
.srow .lb{font-size:17px}.srow .lb .zh{font-size:13px;color:var(--ink2);margin-left:6px}
.srow .val{font:13px system-ui;color:var(--ink2);min-width:38px;text-align:right}
.srow input[type=range]{-webkit-appearance:none;appearance:none;width:44%;height:4px;border-radius:2px;background:#e8d3da;outline:none}
.srow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#d98a9d;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.srow input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#d98a9d}
.sw2{position:relative;width:50px;height:30px;flex:none}.sw2 input{opacity:0;width:0;height:0}
.sw2 i{position:absolute;inset:0;border-radius:15px;background:#dfcfd5;transition:.25s}
.sw2 i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:.25s}
.sw2 input:checked+i{background:#d98a9d}.sw2 input:checked+i:after{transform:translateX(20px)}
.seg{display:flex;background:rgba(120,80,95,.08);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 10px;border-radius:8px;font:13px system-ui;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
#setNote{margin-top:12px;font-size:14px;color:var(--ink2);text-align:center;min-height:1.2em}
@media (orientation:landscape) and (max-height:620px){
  #card.sheet{left:calc(env(safe-area-inset-left,0px) + 14px);transform:none;width:min(40vw,360px);padding:13px 15px 12px;bottom:calc(var(--sab) + 12px);animation:upL .6s cubic-bezier(.2,.9,.3,1)}
  #card .zh1{font-size:21px}#card .en1{font-size:19px}#card .meta{font-size:13.5px}#card .mean{font-size:14.5px;margin-top:6px}#card .mean .zh{font-size:13px}
  #card .row{margin-top:10px}#card .btn{height:40px;font-size:15px;padding:0 14px}
}
@media (orientation:landscape) and (max-height:620px){
  #hint{bottom:calc(var(--sab) + 96px);font-size:15px}
  #joy{width:124px;height:124px;margin:0 0 calc(var(--sab) + 12px) calc(env(safe-area-inset-left,0px) + 14px)}
  #joy i{width:48px;height:48px;margin:-24px}
  #caption{top:14%}#caption .a{font-size:21px}#caption .b{font-size:18px}
  #toast{top:calc(var(--sat) + 62px)}
  .panel{padding-left:calc(env(safe-area-inset-left,0px) + 22px);padding-right:calc(env(safe-area-inset-right,0px) + 22px)}
  .panel h2{font-size:26px}
  #book .grid{grid-template-columns:repeat(4,1fr)}
  #settings #setBody,#peek #peekBody{max-width:640px;width:100%;margin:0 auto}
  #bq{display:grid;grid-template-columns:1fr minmax(300px,44%);align-content:start;column-gap:18px;
      background:linear-gradient(90deg,rgba(255,247,244,0) 0%,rgba(255,247,244,0) 48%,rgba(255,244,240,.93) 60%)}
  #bq>*{grid-column:2}#bq #bqView{display:none}
  #bq .close{grid-column:auto}
}
@keyframes upL{from{transform:translateY(30px);opacity:0}}
 #chatBtn{position:fixed;left:calc(env(safe-area-inset-left,0px) + 14px);top:calc(var(--sat) + 62px);z-index:13;font-size:18px}
#chatBox{position:fixed;left:calc(env(safe-area-inset-left,0px) + 64px);top:calc(var(--sat) + 62px);z-index:13;width:min(300px,70vw);border-radius:14px;background:rgba(25,18,30,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font:14px/1.35 system-ui,sans-serif;overflow:hidden}
#chatLog{height:150px;overflow-y:auto;padding:8px 10px;-webkit-user-select:text;user-select:text;touch-action:pan-y}
#chatLog .cl{margin:2px 0;word-wrap:break-word}
.crow{display:flex;border-top:1px solid rgba(255,255,255,.15)}
#chatIn{flex:1;min-width:0;border:0;background:transparent;color:#fff;font:16px system-ui,sans-serif;padding:9px 10px;outline:none;-webkit-user-select:text;user-select:text;touch-action:auto}
#chatIn::placeholder{color:rgba(255,255,255,.55)}
#chatSend{width:42px;color:#fff;font-size:18px;background:rgba(217,138,157,.6)}
.ntag{text-align:center}.ntag .bub{max-width:200px;margin:0 auto 4px;padding:6px 10px;border-radius:12px;background:rgba(255,250,248,.92);color:#3b2b33;font:14px/1.3 system-ui,sans-serif;text-shadow:none;white-space:normal;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.ringb{position:fixed;left:0;top:0;z-index:12;width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(217,138,157,.45);color:#fff;font-size:16px;box-shadow:0 0 14px rgba(255,190,210,.7);animation:pulse2 2s ease-in-out infinite}
.ringb.self{left:auto;top:auto;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(var(--sab) + 56px);transform:none;background:rgba(255,250,248,.5);color:#a8566c;animation:none}
@keyframes pulse2{50%{box-shadow:0 0 22px rgba(255,190,210,1)}}
#radial{position:fixed;inset:0;z-index:14;pointer-events:none}
.rbtn{position:fixed;transform:translate(-50%,-50%);pointer-events:auto;width:64px;height:64px;border-radius:50%;background:var(--paper2);box-shadow:0 4px 16px rgba(40,20,40,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
.rbtn b{font-size:15px}.rbtn small{font-size:10px;color:var(--ink2);line-height:1.1}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
#gift{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:rgba(30,15,30,.35)}
#gift .gcard{width:min(80vw,300px);padding:16px;border-radius:22px;background:var(--paper2);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:up2 .6s cubic-bezier(.2,.9,.3,1)}
#gift img{width:100%;border-radius:14px;aspect-ratio:1;object-fit:cover}
#giftTxt{margin:10px 0 12px;font-size:17px;line-height:1.45}
#giftKeep{display:inline-flex;margin:0 auto;padding:0 26px}
@media (orientation:landscape) and (max-height:620px){#gift .gcard{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;width:min(70vw,460px)}#gift img{grid-row:span 2}}
@keyframes up2{from{transform:translateY(30px) scale(.95);opacity:0}}
.hrt{position:fixed;bottom:30%;color:#ff8fb0;z-index:16;pointer-events:none;animation:float 3.2s ease-out forwards;text-shadow:0 0 10px rgba(255,150,180,.8)}
@keyframes float{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(-40vh) scale(1.2);opacity:0}}
 #radial{pointer-events:auto;background:rgba(30,15,35,.35);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.rbtn{width:76px;height:76px}.rbtn .ic{font-size:20px;line-height:1}.rbtn b{font-size:14px}.rbtn small{font-size:9.5px}
.rtitle{position:fixed;transform:translate(-50%,-50%);color:#fff;font-size:18px;letter-spacing:.08em;text-shadow:0 2px 12px rgba(0,0,0,.5);pointer-events:none}

@keyframes fl{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.kissh{position:fixed;z-index:41;font-size:30px;transform:translate(-50%,-50%);pointer-events:none;transition:all 1.1s cubic-bezier(.3,0,.3,1)}
#lanAsk,#shot{position:fixed;inset:0;z-index:36;display:grid;place-items:center;background:rgba(30,15,30,.35)}

#lanIn,#invCard{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:16px system-ui,sans-serif;background:#fff;-webkit-user-select:text;user-select:text;touch-action:auto}
#invCard{height:84px;resize:none}
#shotImg{width:100%;border-radius:14px;max-height:62vh;object-fit:contain}

#photoUI .btn{background:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#phShoot{width:66px;height:66px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.5);box-shadow:0 0 0 3px #fff inset,0 4px 18px rgba(0,0,0,.3)}
#photoCount{font-size:70px;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.4);min-height:1em}

#giftArt.fan{position:relative;height:190px}
#giftArt.fan img{position:absolute;left:50%;top:10px;width:120px;margin-left:-60px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.2);transform:translateX(calc(var(--i)*34px)) rotate(calc(var(--i)*9deg));transform-origin:50% 140%}

#invGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.ivi{border-radius:14px;background:rgba(255,255,255,.75);padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:var(--ink);box-shadow:0 2px 8px rgba(80,40,60,.08)}

.bqf{display:flex;width:100%}.bqf img{width:34%;margin-right:-6%;border-radius:50%}

<canvas id="c" tabindex="0"></canvas>

<div id="loader">

  <div class="t2">a little garden, for you</div>
  <div class="bar"><i id="lbar"></i></div>
  <div class="st" id="lst">planting seeds…</div>
  <button id="startBtn" class="hidden">step inside<span class="zh">轻触进入</span></button>
  <div class="whoRow"><button id="whoHer" class="who hidden"></button><button id="whoHim" class="who hidden"></button></div>
</div>

<div id="hud" class="hidden">

    <button id="btnCam" class="round" aria-label="camera">👁</button>
    <button id="btnSet" class="round" aria-label="settings"></button>
    <button id="btnSound" class="round" aria-label="sound"></button>
    <button id="btnBook" class="round" aria-label="herbarium"><span class="badge" id="bookCount">0/8</span></button>
    <button id="btnBouquet" class="round" aria-label="bouquet"><span class="badge" id="bqCount">0</span></button>
  </div>
</div>
<div id="joy" class="idle hidden"><i id="joyKnob"></i></div>
<div id="toast"></div>
<div id="netPill" class="hidden"></div>
<div id="actRow" class="hidden"></div>
<button id="chatBtn" class="round hidden" aria-label="chat">💬<span class="badge" id="chatBadge" style="display:none">0</span></button>
<div id="chatBox" class="hidden"><div id="chatLog"></div><div class="crow"><input id="chatIn" maxlength="300" placeholder="say something… 说点什么" autocomplete="off" enterkeyhint="send"><button id="chatSend">↑</button></div></div>
<button id="peerRing" class="ringb hidden" aria-label="actions">♥</button>
<button id="selfRing" class="ringb self hidden" aria-label="my actions">✿</button>
<div id="radial" class="hidden"></div>
<div id="flash"></div>
<div id="lanAsk" class="hidden"><div class="gcard"><div style="font-size:40px">🏮</div><div style="margin:6px 0 10px">make a wish · 许个愿吧</div>
  <input id="lanIn" maxlength="140" placeholder="your wish… 你的心愿" autocomplete="off"><div class="row"><button class="btn" id="lanNo">✕</button><button class="btn primary" id="lanGo">release 放飞</button></div></div></div>
<div id="photoUI" class="hidden"><div id="photoCount"></div><div style="color:#fff;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.5)">drag to orbit · pinch to zoom · 拖动旋转</div><div class="prow"><button class="btn" id="phExit">✕</button><button class="btn" id="phPose">✿ pose</button><button class="btn" id="phTimer">⏱ 3s</button><button id="phShoot" aria-label="shutter"></button></div></div>
<div id="shot" class="hidden"><div class="gcard"><img id="shotImg" alt=""><div class="row"><button class="btn" id="shotClose">✕</button><button class="btn primary" id="shotSave">save · share 保存</button></div></div></div>

  <div id="invMake" style="display:none;margin-bottom:10px"><textarea id="invCard" maxlength="300" placeholder="write a card… 写一张小卡片"></textarea><button class="btn primary" id="invWrap" style="width:100%;margin-top:8px">wrap it 💐 包起来</button></div>
  <div id="invGrid"></div>
</div>
<div id="mem" class="panel hidden">
  <button class="close" data-close="mem">✕</button>
  <h2>Memories <span class="zh">回忆录</span></h2>
  <div class="sub">our little firsts · 我们的第一次</div>
  <div id="memList"></div>
</div>
<div id="gift" class="hidden"><div class="gcard"><div id="giftArt"></div><div id="giftTxt"></div><button class="btn primary" id="giftKeep">keep it ♥ 收下</button></div></div>

<div id="marker"></div>

  </div>
</div>
